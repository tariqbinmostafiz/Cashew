name: Build Signed DairyBook APK (arm64 and armv7)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Build reason'
        required: false
        default: 'Manual signed APK build'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/budget/android/app/key.jks
      KEY_PROPERTIES_PATH: ${{ github.workspace }}/budget/android/key.properties

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'

      - name: Verify Flutter installation
        run: flutter --version

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: |
          cd budget
          flutter pub get

      - name: Generate database code
        run: |
          cd budget
          dart run build_runner build --delete-conflicting-outputs

      - name: Generate app icons
        run: |
          cd budget
          dart run flutter_launcher_icons

      - name: Create keystore file from base64
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "${{ github.workspace }}/budget/android/app"

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: secret KEYSTORE_BASE64 is empty or not set in THIS repository."
            exit 1
          fi
          echo "Keystore base64 length: ${#KEYSTORE_BASE64}"

          # tr removes any line breaks / spaces / CR that may have been saved with the secret
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "$KEYSTORE_PATH" || {
            echo "ERROR: KEYSTORE_BASE64 is not valid base64. Re-create the secret with: base64 -w 0 key.jks"
            exit 1
          }

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "ERROR: keystore file is empty after decoding"
            exit 1
          fi
          echo "Keystore file created: $(stat -c %s "$KEYSTORE_PATH") bytes"

      - name: Create key.properties file
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          for v in KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "ERROR: secret $v is empty or not set in THIS repository."
              exit 1
            fi
          done
          # printf keeps special characters ($ # spaces) in passwords intact
          printf 'storePassword=%s\n' "$STORE_PASSWORD" > "$KEY_PROPERTIES_PATH"
          printf 'keyPassword=%s\n' "$KEY_PASSWORD" >> "$KEY_PROPERTIES_PATH"
          printf 'keyAlias=%s\n' "$KEY_ALIAS" >> "$KEY_PROPERTIES_PATH"
          printf 'storeFile=key.jks\n' >> "$KEY_PROPERTIES_PATH"

      - name: Check keystore, password and alias (fails early with a clear message)
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" > /tmp/ks.txt 2>&1; then
            echo "Keystore opened OK (store password is correct)."
            grep -c "PrivateKeyEntry" /tmp/ks.txt | sed 's/^/PrivateKeyEntry count: /'
          else
            echo "ERROR: cannot open keystore. STORE_PASSWORD is wrong, or the file is damaged."
            exit 1
          fi
          if keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "Alias found."
          else
            echo "ERROR: KEY_ALIAS does not match any alias in the keystore (it is case-sensitive)."
            echo "Aliases present:"
            grep -E ", [A-Za-z]{3} [0-9]{1,2}, [0-9]{4}, " /tmp/ks.txt | cut -d, -f1 || true
            exit 1
          fi

      - name: Build Signed Release APK for arm64-v8a
        run: |
          cd budget
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/dairybook-arm64-v8a-release.apk

      - name: Build Signed Release APK for armeabi-v7a
        run: |
          cd budget
          flutter build apk --release --target-platform android-arm --split-per-abi
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/dairybook-armeabi-v7a-release.apk

      - name: Verify APK signatures
        run: |
          cd budget
          for apk_file in build/app/outputs/flutter-apk/dairybook-*.apk; do
            echo "Verifying $apk_file"
            jarsigner -verify -verbose -certs "$apk_file" || echo "Warning: Verification failed for $apk_file, but continuing anyway"
          done

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: dairybook-signed-apks
          path: budget/build/app/outputs/flutter-apk/dairybook-*.apk
          retention-days: 30

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f "$KEYSTORE_PATH" "$KEY_PROPERTIES_PATH"
          echo "Sensitive files cleaned up"
